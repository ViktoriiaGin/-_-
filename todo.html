<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список дел</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f5e6d3;
      --card: #7c3f2b;
      --card-inner: #954f34;
      --card-hover: #a85f3d;
      --text: #fdf3e7;
      --text-muted: rgba(253, 243, 231, 0.75);
      --border: rgba(253, 243, 231, 0.18);
      --accent: #e8a33d;
      --accent-soft: rgba(232, 163, 61, 0.2);
      --danger: #d1603d;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Manrope", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1.25rem;
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 2.5rem 2rem 2rem;
      box-shadow: 0 16px 48px rgba(90, 45, 20, 0.3);
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2rem, 5vw, 2.4rem);
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .add-row {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .add-row input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-inner);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
    }

    .add-row input::placeholder {
      color: var(--text-muted);
    }

    .add-row input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .add-row button {
      padding: 0 1.25rem;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #4a2414;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .add-row button:hover {
      transform: translateY(-1px);
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      border-radius: 14px;
      background: var(--card-inner);
      border: 1px solid var(--border);
    }

    .task-item input[type="checkbox"] {
      width: 1.15rem;
      height: 1.15rem;
      flex-shrink: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-delete {
      flex-shrink: 0;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .task-delete:hover {
      background: var(--danger);
      color: #fff;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 1.5rem 0;
    }

    .footer-row {
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .footer-row strong {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Список дел</h1>
    <p class="subtitle">Добавляй задачи, отмечай сделанные, удаляй лишнее</p>

    <div class="add-row">
      <input type="text" id="taskInput" placeholder="Новая задача..." autocomplete="off">
      <button id="addBtn">Добавить</button>
    </div>

    <ul class="task-list" id="taskList"></ul>
    <p class="empty-state" id="emptyState">Пока задач нет — добавь первую</p>

    <div class="footer-row">
      Осталось задач: <strong id="remainingCount">0</strong>
    </div>
  </main>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const emptyState = document.getElementById('emptyState');
    const remainingCount = document.getElementById('remainingCount');

    let tasks = [];

    function render() {
      taskList.innerHTML = '';
      emptyState.style.display = tasks.length === 0 ? 'block' : 'none';

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.addEventListener('change', () => {
          tasks[index].done = checkbox.checked;
          render();
        });

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'task-delete';
        deleteBtn.textContent = '✕';
        deleteBtn.setAttribute('aria-label', 'Удалить задачу');
        deleteBtn.addEventListener('click', () => {
          tasks.splice(index, 1);
          render();
        });

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(deleteBtn);
        taskList.appendChild(li);
      });

      const left = tasks.filter(t => !t.done).length;
      remainingCount.textContent = left;
    }

    function addTask() {
      const value = taskInput.value.trim();
      if (value === '') return;
      tasks.push({ text: value, done: false });
      taskInput.value = '';
      render();
      taskInput.focus();
    }

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    render();
  </script>
</body>
</html>
